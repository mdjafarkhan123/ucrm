# ClamAV daemon settings for the Files and Media upload pipeline.
#
# Only the values that differ from the shipped defaults are here. The important one is the stream size:
# clamd refuses an INSTREAM larger than StreamMaxLength, which defaults to 25 MB, and the File Manager
# accepts files up to 100 MB. Without these two lines every large upload comes back as a scanner error and
# stays pending forever.

LogTime yes
Foreground yes

# The image's own start-up script and its `clamdcheck.sh` health check talk to clamd over this unix socket.
# Leaving it out makes the container wait for a socket that never appears and never report healthy.
LocalSocket /tmp/clamd.sock

# Listen on TCP for the app container. The daemon is on a private Docker network and is never published to
# the internet; it has no authentication of its own, so reaching it must stay a network-level privilege.
TCPSocket 3310
TCPAddr 0.0.0.0

# Matches the 100 MB per-file ceiling the File Manager enforces, with headroom.
StreamMaxLength 110M
MaxScanSize 110M
MaxFileSize 110M
